# Managed by DevRocket Ecosystem.
# Herdr is installed separately; this overlay configures the local terminal workflow.
onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

[theme.custom]
panel_bg = "#06080f"
accent = "#6FA0AF"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

[ui]
accent = "#6FA0AF"
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
